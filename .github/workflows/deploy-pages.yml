name: Deploy to GitHub Pages

# Publica el sitio actualizando la rama gh-pages (fuente de GitHub Pages)
# con el contenido de la rama de desarrollo en cada push.
on:
  push:
    branches:
      - claude/compassionate-cannon-3a1v0c
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin "HEAD:gh-pages" --force
